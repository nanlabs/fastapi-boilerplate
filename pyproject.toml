[project]
name = "fastapi-boilerplate"
version = "0.1.0"
description = "FastAPI boilerplate with SQLite, Alembic migrations, and modern tooling"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "NaNLABS", email = "dev@nanlabs.com" }]
keywords = ["fastapi", "api", "backend", "sqlite", "boilerplate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# =========================
# Production / runtime deps
# =========================
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.128.0",
  "pydantic-settings>=2.14.2",
  "pydantic>=2.12.0",
  "python-dotenv>=1.2.2",
  "sqlalchemy>=2.0.45",
  "uvicorn>=0.40.0",
]

# ==========================================
# Development / CI tooling (uv dependency-groups)
# ==========================================
[dependency-groups]
dev = [
  # Tests
  "httpx>=0.25",
  "pytest-asyncio>=0.21",
  "pytest-cov>=4.1",
  "pytest>=9.0.3",
  # Linting and Formatting (Ruff replaces black, isort, flake8, pylint)
  "ruff>=0.6",
  # Typing
  "mypy>=1.10",
  # Security
  "bandit>=1.7",
  # Hooks / tooling
  "pre-commit>=4.0",
]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*"]

# ==========================================================
# TESTS
# ==========================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config -v"
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "slow: Slow tests",
]
asyncio_mode = "auto"

# ==========================================================
# FORMATTING & LINTING (Ruff)
# ==========================================================
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  "alembic",
  "__pycache__",
  "*.pyc",
  ".pytest_cache",
  ".ruff_cache",
  ".mypy_cache",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ==========================================================
# TYPING
# ==========================================================
[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_reexport = true
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = "annotation-unchecked"
warn_return_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.customer_churn_data_script"
ignore_errors = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# ==========================================================
# SECURITY
# ==========================================================
[tool.bandit]
exclude_dirs = ["tests", "**/tests/**", "alembic", ".venv", "**/.venv/**"]
skips = ["B101", "B104", "B110", "B311", "B404", "B603", "B607"]
