name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  fast-quality:
    name: Fast Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make install-dev

      - name: Run fast checks
        run: |
          make check-docs
          make lint
          make format

  full-quality:
    name: Full Quality
    runs-on: ubuntu-latest
    needs: fast-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make install-dev

      - name: Run full quality checks
        run: make all-checks

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: fast-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make install-dev

      - name: Run tests
        run: make test

  mega-linter:
    name: Mega Linter
    runs-on: ubuntu-latest
    needs: [fast-quality, full-quality, tests]
    if: ${{ vars.ENABLE_MEGA_LINTER == 'true' }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
